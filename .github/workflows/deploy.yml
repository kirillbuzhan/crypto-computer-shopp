# Кнопка «Run workflow» на вкладке Actions: тесты, затем развёртывание на сервер.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     — IP или домен сервера
#   DEPLOY_USER     — пользователь SSH (например, root)
#   DEPLOY_SSH_KEY  — приватный SSH-ключ (публичный — в ~/.ssh/authorized_keys на сервере)
#   DEPLOY_PATH     — каталог проекта на сервере (необязательно, по умолчанию /opt/crypto-lab)

name: Deploy

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Развернуть на сервере
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/crypto-lab' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: REPO_URL,DEPLOY_PATH
          script: |
            set -e
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              git clone "$REPO_URL" "$DEPLOY_PATH"
            fi
            cd "$DEPLOY_PATH"
            bash ./deploy.sh
