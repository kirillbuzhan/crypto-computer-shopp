# Пример конфигурации nginx для сайта лаборатории.
#
# Вариант А — отдельный домен или поддомен: https://crypto.university.ru/
# Вариант Б — подкаталог существующего сайта: https://university.ru/crypto-lab/
#             (тогда в .env нужно задать ROOT_PATH=/crypto-lab)
#
# Приложение слушает 127.0.0.1:3250 (Docker или systemd, см. README.md).

upstream crypto_lab {
    server 127.0.0.1:3250;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name crypto.university.ru;

    # ssl_certificate     /etc/letsencrypt/live/crypto.university.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/crypto.university.ru/privkey.pem;

    client_max_body_size 256k;

    # --- Вариант А: весь домен ---
    location / {
        proxy_pass http://crypto_lab;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- Вариант Б: подкаталог /crypto-lab/ (раскомментируйте вместо варианта А) ---
    # location = /crypto-lab {
    #     return 301 /crypto-lab/;
    # }
    # location /crypto-lab/ {
    #     # Слэш в конце proxy_pass отрезает префикс: приложение получает /theory, /lab, ...
    #     proxy_pass http://crypto_lab/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 30s;
    # }

    # Ограничение частоты запросов к API (генерация ключей и разборы — самые тяжёлые).
    # Добавьте в блок http:  limit_req_zone $binary_remote_addr zone=crypto_api:10m rate=5r/s;
    # и в location:          limit_req zone=crypto_api burst=20 nodelay;
}
